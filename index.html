<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Tamagotchi Editor v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo">🐱 TAMAGOTCHI <span>PRO EDITOR</span></div>
        <div class="controls">
            <select id="ui-lang-select" class="clean-select">
                <option value="ru">🇷🇺 Русский</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
            <button id="btn-save-all" class="btn btn-primary">💾 Сохранить проект</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <button class="tab-btn active" data-target="p-main">⚙️ Главное</button>
            <button class="tab-btn" data-target="p-design">🎨 Дизайн и Фоны</button>
            <button class="tab-btn" data-target="p-tasks">📝 Задания (A1-C2)</button>
            <button class="tab-btn" data-target="p-reactions">🎭 Реакции питомца</button>
            <button class="tab-btn" data-target="p-shop">💰 Магазин и Баллы</button>
            <button class="tab-btn" data-target="p-timer">⏲️ Таймер и Оценки</button>
            <button class="tab-btn" data-target="p-export">🔲 Экспорт Iframe</button>
        </aside>

        <main class="main-content">
            <section id="p-main" class="panel active">
                <h2 class="card-title">Основные настройки</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">Название курса/игры</label>
                        <input type="text" id="game-name" class="clean-input" placeholder="Введите название...">
                    </div>
                </div>
            </section>

            <section id="p-design" class="panel">
                <h2 class="card-title">Оформление и Фоны</h2>
                <div class="card">
                    <label class="lbl">Ссылка на фоновое изображение (URL)</label>
                    <input type="text" id="bg-url" class="clean-input" placeholder="https://...">
                    <div class="settings-grid" style="margin-top:15px;">
                        <div class="form-group">
                            <label class="lbl">Основной цвет интерфейса</label>
                            <input type="color" id="color-primary" value="#0ea5e9">
                        </div>
                    </div>
                </div>
            </section>

            <section id="p-tasks" class="panel">
                <h2 class="card-title">Учебный материал</h2>
                <div class="card">
                    <div id="tasks-container">
                        </div>
                    <button id="add-task" class="btn btn-outline">+ Добавить новое задание</button>
                </div>
            </section>

            <section id="p-reactions" class="panel">
                <h2 class="card-title">Реплики и реакции</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">Радость (при верном ответе)</label>
                        <input type="text" id="msg-happy" class="clean-input" placeholder="Супер! Ты молодец!">
                    </div>
                    <div class="form-group">
                        <label class="lbl">Грусть (при ошибке)</label>
                        <input type="text" id="msg-sad" class="clean-input" placeholder="Ой, попробуй еще раз...">
                    </div>
                </div>
            </section>

            <section id="p-shop" class="panel">
                <h2 class="card-title">Экономика игры</h2>
                <div class="card">
                    <div class="settings-grid">
                        <div class="form-group">
                            <label class="lbl">Баллов за верный ответ</label>
                            <input type="number" id="pts-plus" class="clean-input" value="10">
                        </div>
                        <div class="form-group">
                            <label class="lbl">Штраф за ошибку</label>
                            <input type="number" id="pts-minus" class="clean-input" value="5">
                        </div>
                    </div>
                </div>
            </section>

            <section id="p-timer" class="panel">
                <h2 class="card-title">Время и Оценка</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">Время на игру (сек)</label>
                        <input type="number" id="timer-val" class="clean-input" value="300">
                    </div>
                </div>
            </section>

            <section id="p-export" class="panel">
                <h2 class="card-title">Получение Iframe кода</h2>
                <div class="card">
                    <textarea id="iframe-res" class="code-area" readonly></textarea>
                    <button id="copy-iframe" class="btn btn-primary" style="margin-top:10px;">📋 Копировать код</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
