<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi Academic Editor v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo">🐱 TAMAGOTCHI <span>PRO</span></div>
        <div class="header-actions">
            <select id="ui-lang-select" class="clean-select">
                <option value="ru">🇷🇺 Русский</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="fa">🇮🇷 فارسی</option>
                <option value="prs">🇦🇫 دری (Dari)</option>
            </select>
            <button id="btn-save" class="btn btn-primary">💾 Сохранить проект</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <button class="tab-btn active" data-target="p-settings">⚙️ Настройки</button>
            <button class="tab-btn" data-target="p-design">🎨 Дизайн и Фоны</button>
            <button class="tab-btn" data-target="p-lexicon">📚 Лексика (A1-C2)</button>
            <button class="tab-btn" data-target="p-grammar">✍️ Грамматика</button>
            <button class="tab-btn" data-target="p-reactions">🎭 Реакции Анфисы</button>
            <button class="tab-btn" data-target="p-shop">💰 Магазин и Баллы</button>
            <button class="tab-btn" data-target="p-timer">⏲️ Таймер и Оценки</button>
            <button class="tab-btn" data-target="p-export">🔲 Генератор Iframe</button>
        </aside>

        <main class="main-content">
            <section id="p-settings" class="panel active">
                <h2 class="card-title">Общая информация</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">Заголовок игры</label>
                        <input type="text" id="game-title" class="clean-input" placeholder="Например: Сильные глаголы">
                    </div>
                    <div class="form-group">
                        <label class="lbl">ID проекта (GitHub)</label>
                        <input type="text" id="project-id" class="clean-input" value="irinschensmagen-alt">
                    </div>
                </div>
            </section>

            <section id="p-design" class="panel">
                <h2 class="card-title">Визуальное оформление</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">URL фонового изображения</label>
                        <input type="text" id="bg-url" class="clean-input" placeholder="https://example.com/bg.jpg">
                    </div>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label class="lbl">Цвет интерфейса</label>
                            <input type="color" id="theme-color" class="color-picker" value="#16a34a">
                        </div>
                        <div class="form-group">
                            <label class="lbl">Прозрачность панелей</label>
                            <input type="range" id="ui-opacity" min="0" max="100" value="90">
                        </div>
                    </div>
                </div>
            </section>

            <section id="p-lexicon" class="panel">
                <h2 class="card-title">Словарь и Уровни</h2>
                <div class="card">
                    <div class="level-selector">
                        <button class="lvl-btn active">A1</button>
                        <button class="lvl-btn">A2</button>
                        <button class="lvl-btn">B1</button>
                        <button class="lvl-btn">B2</button>
                        <button class="lvl-btn">C1</button>
                    </div>
                    <div id="words-list" class="dynamic-list">
                        </div>
                    <button id="add-word" class="btn btn-outline">+ Добавить слово</button>
                </div>
            </section>

            <section id="p-reactions" class="panel">
                <h2 class="card-title">Поведение питомца</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="lbl">При верном ответе (Радость)</label>
                        <textarea id="msg-correct" class="clean-textarea">Великолепно! Ты настоящий гений!</textarea>
                    </div>
                    <div class="form-group">
                        <label class="lbl">При ошибке (Грусть)</label>
                        <textarea id="msg-wrong" class="clean-textarea">Ой! Попробуй еще раз, я верю в тебя!</textarea>
                    </div>
                </div>
            </section>

            <section id="p-shop" class="panel">
                <h2 class="card-title">Экономика и Бонусы</h2>
                <div class="card">
                    <div class="settings-grid">
                        <div class="form-group">
                            <label class="lbl">Награда за ответ</label>
                            <input type="number" id="coin-reward" class="clean-input" value="10">
                        </div>
                        <div class="form-group">
                            <label class="lbl">Цена в магазине</label>
                            <input type="number" id="item-price" class="clean-input" value="50">
                        </div>
                    </div>
                </div>
            </section>

            <section id="p-export" class="panel">
                <h2 class="card-title">Код для Genially</h2>
                <div class="card">
                    <div class="settings-grid" style="margin-bottom:15px;">
                        <div class="form-group">
                            <label class="lbl">Ширина</label>
                            <input type="text" id="if-w" class="clean-input" value="100%">
                        </div>
                        <div class="form-group">
                            <label class="lbl">Высота</label>
                            <input type="text" id="if-h" class="clean-input" value="750px">
                        </div>
                    </div>
                    <textarea id="iframe-output" class="code-box" readonly></textarea>
                    <button id="copy-code" class="btn btn-primary" style="margin-top:10px; width:100%;">📋 Копировать код</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
